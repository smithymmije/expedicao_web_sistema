<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>📦 {% block title %}Controle de Expedição{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* CSS de LAYOUT para o Sticky Footer (Não altera cores) */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }
        main {
            flex-grow: 1; 
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="{{ url_for('painel') }}">
                    <i class="bi bi-box-seam me-2"></i>
                    <span class="fw-bold">Controle de Expedição</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        
                        {% if current_user.is_authenticated %}
                            
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="{{ url_for('painel') }}">
                                    <i class="bi bi-grid-fill"></i> Painel
                                </a>
                            </li>
                            <li class="nav-item me-3"> 
                                <a class="nav-link" href="{{ url_for('criar_pedido') }}">
                                    <i class="bi bi-plus-circle-fill"></i> Novo Pedido
                                </a>
                            </li>

                            <!--<li class="nav-item d-flex align-items-center me-3">
                                <span class="navbar-text me-2 small text-info">
                                    <i class="bi bi-person-fill"></i> **{{ current_user.name }}**
                                </span>
                            </li>-->
                            
                            <li class="nav-item">
                                <a class="nav-link btn btn-sm btn-outline-light" href="{{ url_for('logout') }}" title="Sair do sistema">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </a>
                            </li>

                        {% endif %}
                        
                        <li class="nav-item d-flex align-items-center ms-3">
                            <a href="https://jimmysmith.com.br" target="_blank" class="text-white nav-link p-0 me-3 small" title="Site oficial">
                                <i class="bi bi-globe"></i> jimmysmith.com.br
                            </a>
                            <a href="https://github.com/smithymmije" target="_blank" class="text-white nav-link p-0" title="GitHub">
                                <i class="bi bi-github fs-5"></i>
                            </a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    

    <main class="container-fluid py-4">
        {% block conteudo %}{% endblock %}
    </main>
    
    {% include 'footer.html' %} 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
