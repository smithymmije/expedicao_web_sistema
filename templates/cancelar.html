{% extends "base.html" %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8"> 
        
        <h2 class="mb-4 d-flex align-items-center text-danger">
            <i class="bi bi-x-octagon-fill me-2"></i> Cancelar Pedido <span class="fw-bold ms-1">#{{ pedido }}</span>
        </h2>
        
        <div class="alert alert-danger mb-4" role="alert">
            <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill me-2"></i> Atenção!</h4>
            <p class="mb-0">Esta ação não pode ser desfeita. Por favor, insira o motivo do cancelamento e seu nome para confirmar.</p>
        </div>

        <form method="post" class="p-4 border border-danger rounded shadow-sm bg-white">
            
            <div class="mb-3">
                <label for="motivo" class="form-label fw-bold">Motivo do cancelamento <span class="text-danger">*</span></label>
                <textarea id="motivo" name="motivo" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-4">
                <label for="usuario" class="form-label fw-bold">Seu nome <span class="text-danger">*</span></label>
                <input type="text" id="usuario" name="usuario" placeholder="Quem cancela" class="form-control" required>
            </div>

            <div class="d-flex justify-content-end gap-3">
                
                <button type="submit" class="btn btn-danger btn-lg">
                    <i class="bi bi-trash-fill me-1"></i> Confirmar Cancelamento
                </button>
                
                <a href="{{ url_for('painel') }}" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left-circle-fill me-1"></i> Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
